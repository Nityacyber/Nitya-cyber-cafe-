<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitya CSC</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f6fb;
  color:#222;
}

header{
  background:#075e54;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  font-size:28px;
}

header p{
  margin-top:6px;
  font-size:14px;
}

.container{
  padding:18px;
  max-width:600px;
  margin:auto;
}

.section-title{
  font-size:20px;
  font-weight:bold;
  margin:10px 0 15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:white;
  padding:20px 10px;
  border-radius:14px;
  text-align:center;
  text-decoration:none;
  color:#222;
  box-shadow:0 3px 10px rgba(0,0,0,.10);
  transition:.2s;
}

.card:active{
  transform:scale(.96);
}

.icon{
  font-size:30px;
  margin-bottom:8px;
}

.card b{
  font-size:15px;
}

footer{
  text-align:center;
  padding:25px 10px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🖥️ Nitya CSC</h1>
  <p>Digital Service & Online Work</p>
</header>

<div class="container">

  <div class="section-title">Important Services</div>

  <div class="grid">

    <a class="card" href="https://digitalseva.csc.gov.in/" target="_blank">
      <div class="icon">🏢</div>
      <b>CSC Portal</b>
    </a>

    <a class="card" href="https://myaadhaar.uidai.gov.in/" target="_blank">
      <div class="icon">🪪</div>
      <b>Aadhaar</b>
    </a>

    <a class="card" href="https://www.pan.utiitsl.com/" target="_blank">
      <div class="icon">💳</div>
      <b>PAN Card</b>
    </a>

    <a class="card" href="https://land.bihar.gov.in/" target="_blank">
      <div class="icon">🏠</div>
      <b>Bihar Land Record</b>
    </a>

    <a class="card" href="https://serviceonline.bihar.gov.in/" target="_blank">
      <div class="icon">📄</div>
      <b>Bihar Online</b>
    </a>

    <a class="card" href="https://www.jpsc.gov.in/" target="_blank">
      <div class="icon">🎓</div>
      <b>Education</b>
    </a>

  </div>

  <div class="section-title" style="margin-top:25px;">
    Other Services
  </div>

  <div class="grid">

    <a class="card" href="https://www.google.com/" target="_blank">
      <div class="icon">🔍</div>
      <b>Google</b>
    </a>

    <a class="card" href="https://web.whatsapp.com/" target="_blank">
      <div class="icon">💬</div>
      <b>WhatsApp</b>
    </a>

  </div>

</div>

<footer>
  © 2026 Nitya CSC<br>
  Raipatti, Dighwara, Saran, Bihar
</footer>

</body>
</html>
